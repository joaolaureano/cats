<div class="d-flex align-items-center flex-column">
  <img src="{{ httpImage }}" class="img-fluid w-50 mw-50 my-2" />
  <label> Type the HTTP code:</label>
  <input class="w-25" [(ngModel)]="httpCode" />
  <button
    [disabled]="!httpCode"
    (click)="generateFunnyImage()"
    class="btn bg-dark text-white"
  >
    GENERATE FUNNY IMAGE
  </button>
</div>

<app-back-button class="position"></app-back-button>
